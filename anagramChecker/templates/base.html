<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}Anagram Checker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body hx-boost="true" class="min-h-screen bg-base-200">
    <div class="navbar bg-base-100 shadow-sm">
        <div class="container mx-auto max-w-xl">
            <a href="{% url 'index' %}" class="btn btn-ghost text-xl">Anagram Checker</a>
        </div>
    </div>
    <main class="container mx-auto max-w-xl p-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
