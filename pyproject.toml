[project]
name = "anagram"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordhy-jpg", email = "177513224+Jordhy-jpg@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "markdown>=3.11.4",
    "psycopg>=3.3.9",
    "psycopg-binary>=3.3.9",
]

[project.scripts]
anagram = "anagram:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
